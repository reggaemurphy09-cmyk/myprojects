<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notes</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #f7f4ef; }

  :root {
    --bg: #f7f4ef;
    --card: #ffffff;
    --accent: #b07d4a;
    --accent-light: #fdf6ed;
    --text: #1a1814;
    --text-mid: #6a6050;
    --text-soft: #a09880;
    --text-faint: #c0b8a8;
    --border: #e8e0d4;
    --input-bg: #edeae3;
  }

  body { font-family: Georgia, 'Times New Roman', serif; color: var(--text); }

  .app {
    height: 100dvh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* SCREENS */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s;
    will-change: transform;
  }
  .screen.hidden { transform: translateX(100%); pointer-events: none; }
  .screen.slide-left { transform: translateX(-30%); opacity: 0.5; pointer-events: none; }

  /* ── LIST ── */
  #list-screen { background: var(--bg); }

  .list-header {
    padding: 52px 24px 16px;
    flex-shrink: 0;
  }
  .app-title {
    font-family: Georgia, serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }
  .app-title em { color: var(--accent); font-style: italic; }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--input-bg);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .search-bar svg { color: var(--text-soft); flex-shrink: 0; }
  #search-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: -apple-system, Helvetica, sans-serif;
    font-size: 15px;
    color: var(--text);
  }
  #search-input::placeholder { color: var(--text-soft); }
  #search-clear { background: none; border: none; color: var(--text-soft); font-size: 16px; cursor: pointer; display: none; padding: 0 2px; }

  .notes-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 100px;
    -webkit-overflow-scrolling: touch;
  }

  .note-card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px 48px 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: transform 0.12s;
    position: relative;
    user-select: none;
  }
  .note-card:active { transform: scale(0.97); }
  .note-card-title {
    font-family: Georgia, serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-card-preview {
    font-size: 13px;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
  }
  .note-card-time { font-size: 12px; color: var(--text-faint); }
  .note-del {
    position: absolute;
    top: 50%; right: 14px;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 18px;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    line-height: 1;
  }
  .note-del:active { color: #c06060; }

  .empty-state {
    text-align: center;
    padding: 70px 24px;
    color: var(--text-faint);
  }
  .empty-icon { font-size: 44px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  .fab {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 58px; height: 58px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(176,125,74,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
    transition: transform 0.15s;
  }
  .fab:active { transform: translateX(-50%) scale(0.92); }

  /* ── EDITOR ── */
  #editor-screen { background: var(--card); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 52px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 10px;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 16px;
    font-family: -apple-system, Helvetica, sans-serif;
    cursor: pointer;
    display: flex; align-items: center; gap: 3px;
    padding: 6px 0;
    white-space: nowrap;
    -webkit-appearance: none;
  }
  .topbar-meta { font-size: 12px; color: var(--text-faint); flex: 1; text-align: center; }
  .ai-open-btn {
    background: var(--accent-light);
    border: 1px solid #e8d9c4;
    color: var(--accent);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: -apple-system, Helvetica, sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    -webkit-appearance: none;
  }
  .ai-open-btn:active { background: #f0e2cc; }

  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 100px;
    -webkit-overflow-scrolling: touch;
    position: relative;
    z-index: 1;
  }
  #note-title {
    width: 100%;
    border: none;
    outline: none;
    font-family: Georgia, serif;
    font-size: 26px;
    font-weight: bold;
    color: var(--text);
    background: transparent;
    resize: none;
    line-height: 1.3;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
    overflow: hidden;
    display: block;
    -webkit-appearance: none;
    -webkit-user-select: text;
    user-select: text;
  }
  #note-title::placeholder { color: #d8d0c0; }
  .editor-rule {
    width: 32px; height: 2px;
    background: var(--accent);
    border-radius: 1px;
    margin: 14px 0 18px;
  }
  #note-body {
    width: 100%;
    border: none;
    outline: none;
    font-family: -apple-system, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: 300;
    color: #4a4540;
    background: transparent;
    resize: none;
    line-height: 1.8;
    min-height: 200px;
    overflow: hidden;
    display: block;
    -webkit-appearance: none;
    -webkit-user-select: text;
    user-select: text;
  }
  #note-body::placeholder { color: #d8d0c0; }

  /* ── AI SCREEN ── */
  #ai-screen { background: var(--bg); }

  .ai-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 52px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ai-title {
    font-family: Georgia, serif;
    font-size: 18px;
    font-style: italic;
    color: var(--accent);
  }

  .ai-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 18px 140px;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .ai-note-preview {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    border-left: 3px solid var(--accent);
  }
  .ai-preview-title {
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .ai-preview-body {
    font-size: 13px;
    color: var(--text-soft);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .section-label {
    font-size: 11px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .quick-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text-mid);
    cursor: pointer;
    font-family: -apple-system, Helvetica, sans-serif;
    text-align: left;
    transition: background 0.1s;
    -webkit-appearance: none;
  }
  .quick-chip:active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

  .ai-result-box {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    border-left: 3px solid var(--accent);
    font-size: 15px;
    color: #3a3530;
    line-height: 1.7;
    white-space: pre-wrap;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }
  .ai-actions { display: flex; gap: 10px; }
  .apply-btn {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-family: -apple-system, Helvetica, sans-serif;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .apply-btn:active { background: #9a6a38; }
  .discard-btn {
    background: var(--input-bg);
    color: var(--text-mid);
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 15px;
    font-family: -apple-system, Helvetica, sans-serif;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .discard-btn:active { background: #d8d4cc; }

  .dots {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 20px;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .ai-input-bar {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 480px;
    padding: 12px 16px 28px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  #ai-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 11px 16px;
    font-size: 15px;
    font-family: -apple-system, Helvetica, sans-serif;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
  }
  #ai-input::placeholder { color: var(--text-faint); }
  #ai-send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    align-self: center;
    transition: background 0.15s;
  }
  #ai-send:disabled { background: var(--input-bg); color: var(--text-faint); }
  #ai-send:active { background: #9a6a38; }

  .hidden { display: none !important; }
</style>

</head>
<body>
<div class="app">

  <!-- LIST SCREEN -->

  <div class="screen" id="list-screen">
    <div class="list-header">
      <div class="app-title">My <em>Notes</em></div>
      <div class="search-bar">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search-input" type="search" placeholder="Search…" autocomplete="off">
        <button id="search-clear">✕</button>
      </div>
    </div>
    <div class="notes-scroll" id="notes-list"></div>
    <button class="fab" id="new-note-btn">＋</button>
  </div>

  <!-- EDITOR SCREEN -->

  <div class="screen hidden" id="editor-screen">
    <div class="topbar">
      <button class="back-btn" id="editor-back">‹ Notes</button>
      <span class="topbar-meta" id="word-count"></span>
      <button class="ai-open-btn" id="open-ai-btn">✦ AI</button>
    </div>
    <div class="editor-scroll">
      <textarea id="note-title" rows="1" placeholder="Title"></textarea>
      <div class="editor-rule"></div>
      <textarea id="note-body" rows="6" placeholder="Start writing…"></textarea>
    </div>
  </div>

  <!-- AI SCREEN -->

  <div class="screen hidden" id="ai-screen">
    <div class="ai-topbar">
      <button class="back-btn" id="ai-back">‹ Back</button>
      <span class="ai-title">✦ AI Assistant</span>
      <div style="width:60px"></div>
    </div>
    <div class="ai-scroll" id="ai-scroll">
      <div class="ai-note-preview">
        <div class="ai-preview-title" id="ai-preview-title"></div>
        <div class="ai-preview-body" id="ai-preview-body"></div>
      </div>
      <div class="section-label">Quick actions</div>
      <div class="quick-grid" id="quick-grid"></div>
      <div id="ai-loading" class="dots hidden">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div id="ai-result-box" class="ai-result-box hidden"></div>
      <div id="ai-actions" class="ai-actions hidden">
        <button class="apply-btn" id="apply-btn">Add to note</button>
        <button class="discard-btn" id="discard-btn">Discard</button>
      </div>
    </div>
    <div class="ai-input-bar">
      <input id="ai-input" type="text" placeholder="Ask anything about this note…" autocomplete="off">
      <button id="ai-send" disabled>↑</button>
    </div>
  </div>

</div>

<script>
// ── STATE ──
let notes = [
  { id: 'welcome', title: 'Welcome ✦', body: 'Tap a note to edit it, or tap + to create a new one.\n\nTap ✦ AI while editing to get writing help — summarize, improve, expand and more.', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }
];
let activeId = null;
let aiResult = '';

// ── UTILS ──
const uid = () => Math.random().toString(36).substr(2, 9);
const timeAgo = (iso) => {
  const d = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (d < 1) return 'just now';
  if (d < 60) return d + 'm ago';
  if (d < 1440) return Math.floor(d/60) + 'h ago';
  return Math.floor(d/1440) + 'd ago';
};
const $ = (id) => document.getElementById(id);

// ── PERSISTENCE ──
async function saveNotes() {
  try { await window.storage.set('notes_html_v1', JSON.stringify(notes)); } catch {}
}
async function loadNotes() {
  try {
    const r = await window.storage.get('notes_html_v1');
    if (r?.value) notes = JSON.parse(r.value);
  } catch {}
}

// ── SCREENS ──
function showScreen(id) {
  ['list-screen','editor-screen','ai-screen'].forEach(s => {
    const el = $(s);
    el.classList.remove('hidden','slide-left');
    if (s !== id) el.classList.add('hidden');
  });
}

// ── RENDER LIST ──
function renderList(filter = '') {
  const list = $('notes-list');
  const q = filter.toLowerCase();
  const filtered = notes.filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><p>${filter ? 'No notes found' : 'Tap + to write your first note'}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(n => `
    <div class="note-card" data-id="${n.id}">
      <div class="note-card-title">${escHtml(n.title || 'Untitled')}</div>
      <div class="note-card-preview">${escHtml(n.body?.slice(0,80) || 'Empty note')}</div>
      <div class="note-card-time">${timeAgo(n.updatedAt)}</div>
      <button class="note-del" data-del="${n.id}">✕</button>
    </div>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── OPEN NOTE ──
function openNote(id) {
  activeId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return;
  $('note-title').value = note.title;
  $('note-body').value = note.body;
  autoResize($('note-title'));
  autoResize($('note-body'));
  updateWordCount();
  showScreen('editor-screen');
}

// ── UPDATE NOTE ──
function updateActiveNote() {
  if (!activeId) return;
  notes = notes.map(n => n.id === activeId
    ? { ...n, title: $('note-title').value, body: $('note-body').value, updatedAt: new Date().toISOString() }
    : n
  );
  saveNotes();
  updateWordCount();
}

function updateWordCount() {
  const w = ($('note-body').value.trim().split(/\s+/).filter(Boolean).length) || 0;
  $('word-count').textContent = w > 0 ? w + ' words' : '';
}

// ── NEW NOTE ──
function createNote() {
  const note = { id: uid(), title: '', body: '', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
  notes.unshift(note);
  saveNotes();
  openNote(note.id);
  setTimeout(() => $('note-title').focus(), 100);
}

// ── DELETE ──
function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  saveNotes();
  if (activeId === id) { activeId = null; showScreen('list-screen'); }
  renderList($('search-input').value);
}

// ── AUTO RESIZE TEXTAREA ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// ── AI SCREEN ──
function openAI() {
  updateActiveNote();
  const note = notes.find(n => n.id === activeId);
  $('ai-preview-title').textContent = note?.title || 'Untitled';
  $('ai-preview-body').textContent = note?.body || '(empty note)';
  resetAIResult();
  showScreen('ai-screen');
}

function resetAIResult() {
  aiResult = '';
  $('ai-result-box').classList.add('hidden');
  $('ai-actions').classList.add('hidden');
  $('ai-loading').classList.add('hidden');
  $('ai-input').value = '';
  $('ai-send').disabled = true;
}

async function callAI(prompt) {
  if (!prompt.trim() || !activeId) return;
  const note = notes.find(n => n.id === activeId);
  $('ai-loading').classList.remove('hidden');
  $('ai-result-box').classList.add('hidden');
  $('ai-actions').classList.add('hidden');
  $('ai-send').disabled = true;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'You are a concise writing assistant. Respond directly without preamble.',
        messages: [{ role: 'user', content: `Note title: ${note?.title || '(untitled)'}\n\nNote:\n${note?.body || '(empty)'}\n\nRequest: ${prompt}` }]
      })
    });
    const data = await res.json();
    aiResult = data.content?.find(b => b.type === 'text')?.text || 'No response.';
  } catch {
    aiResult = 'Could not reach AI. Please try again.';
  }

  $('ai-loading').classList.add('hidden');
  $('ai-result-box').textContent = aiResult;
  $('ai-result-box').classList.remove('hidden');
  $('ai-actions').classList.remove('hidden');
  $('ai-input').value = '';
  $('ai-send').disabled = true;
  $('ai-scroll').scrollTop = $('ai-scroll').scrollHeight;
}

function applyAI() {
  if (!aiResult || !activeId) return;
  const note = notes.find(n => n.id === activeId);
  const appended = (note.body ? note.body + '\n\n' : '') + aiResult;
  notes = notes.map(n => n.id === activeId ? { ...n, body: appended, updatedAt: new Date().toISOString() } : n);
  saveNotes();
  $('note-body').value = appended;
  autoResize($('note-body'));
  resetAIResult();
  showScreen('editor-screen');
}

// ── QUICK PROMPTS ──
const QUICK = ['Summarize', 'Improve writing', 'Expand ideas', 'Fix grammar', 'Make bullet points', 'Make concise'];
$('quick-grid').innerHTML = QUICK.map(q => `<button class="quick-chip" data-q="${q}">${q}</button>`).join('');

// ── EVENTS ──
$('new-note-btn').addEventListener('click', createNote);

$('notes-list').addEventListener('click', (e) => {
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); deleteNote(del.dataset.del); return; }
  const card = e.target.closest('[data-id]');
  if (card) openNote(card.dataset.id);
});

$('editor-back').addEventListener('click', () => {
  updateActiveNote();
  renderList($('search-input').value);
  showScreen('list-screen');
});

$('open-ai-btn').addEventListener('click', openAI);
$('ai-back').addEventListener('click', () => showScreen('editor-screen'));

$('note-title').addEventListener('input', () => { autoResize($('note-title')); updateActiveNote(); });
$('note-body').addEventListener('input', () => { autoResize($('note-body')); updateActiveNote(); });

$('search-input').addEventListener('input', (e) => {
  renderList(e.target.value);
  $('search-clear').style.display = e.target.value ? 'block' : 'none';
});
$('search-clear').addEventListener('click', () => {
  $('search-input').value = '';
  $('search-clear').style.display = 'none';
  renderList('');
});

$('ai-input').addEventListener('input', (e) => {
  $('ai-send').disabled = !e.target.value.trim();
});
$('ai-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && $('ai-input').value.trim()) callAI($('ai-input').value);
});
$('ai-send').addEventListener('click', () => callAI($('ai-input').value));

$('quick-grid').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-q]');
